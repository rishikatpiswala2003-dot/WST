<!DOCTYPE html>
<html>
<head>
    <title>Lab Task 4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-white p-5">

<div class="container text-center">
    <h3>DOM Manipulation</h3>

    <p id="text" class="fw-bold">Original Text</p>

    <button class="btn btn-warning me-2" onclick="changeText()">Change Text</button>
    <button class="btn btn-dark" onclick="changeBg()">Change Background</button>
</div>

<script>
    function changeText() {
        document.getElementById("text").innerText =
            "Text changed using JavaScript";
    }

    function changeBg() {
        document.body.classList.toggle("bg-dark");
        document.body.classList.toggle("text-white");
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
