<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions Lab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-light p-5">

<div class="container">

    <h2 class="text-center mb-4 text-primary">
        JavaScript Functions Lab
    </h2>

    <!-- Q1: greet() -->
    <div class="card p-3 mb-3">
        <h5>Q1: Greet Function</h5>
        <button class="btn btn-success" onclick="greet()">Run greet()</button>
    </div>

    <!-- Q14: Show Time -->
    <div class="card p-3 mb-3">
        <h5>Q14: Show Current Time</h5>
        <button class="btn btn-primary" onclick="showTime()">Show Time</button>
    </div>

    <!-- Q15: Input Alert -->
    <div class="card p-3 mb-3">
        <h5>Q15: Show Input in Alert</h5>
        <input type="text" id="userInput" class="form-control mb-2"
               placeholder="Enter your name">
        <button class="btn btn-warning" onclick="showInput()">
            Show Alert
        </button>
    </div>

    <!-- Q21: Reverse String -->
    <div class="card p-3 mb-3">
        <h5>Q21: Reverse a String</h5>
        <input type="text" id="reverseText" class="form-control mb-2"
               placeholder="Enter text">
        <button class="btn btn-dark" onclick="reverseString()">
            Reverse
        </button>
        <p id="result" class="mt-2 fw-bold text-success"></p>
    </div>

</div>

<script src="functions.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
